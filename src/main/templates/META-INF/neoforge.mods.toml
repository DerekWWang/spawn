license="${mod_license}"

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
description='''
A brutal-realism survival overhaul. Players, bots and script-controlled humanoids share one
physiology (hunger, thirst, body temperature, injuries, illness and a daily need for recreation)
in a world with seasons, regional weather, regional geology and predators. Vanilla shortcuts are
removed: tools, pottery, clothing and metal come from timed work at kilns, forges, looms and
other workstations, supported by seasonal agriculture and livestock, learned skills, era-gated
industry, carts and railways, and warfare from muskets to siege artillery.

On top of it sits a functional tech tree from stone tools to servers: every technology is a function a
society discovers by holding its inputs and means of production, then runs by hand or at stations
built to realistic scale, under physics, engineering and logistics engines. Press J for the journal.
'''

[[mixins]]
config="spawn_living_world.mixins.json"
[[mixins]]
config="spawn_survival.mixins.json"

[[dependencies.${mod_id}]] #optional
    modId="neoforge" #mandatory
    type="required" #mandatory
    versionRange="[${neo_version},)" #mandatory
    # After NeoForge, so that this mod's data sits above NeoForge's own: NeoForge replaces the game's tool,
    # armour, bucket and shears recipes with its own, and loaded the other way round those won over the ones struck out here.
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[mixins]]
    config="spawn_environment.mixins.json"

[[dependencies.${mod_id}]]
    modId="tectonic"
    type="optional"
    versionRange="[3.0.32]"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="lithostitched"
    type="optional"
    versionRange="[2.0.6]"
    ordering="AFTER"
    side="BOTH"
